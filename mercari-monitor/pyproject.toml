[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length isn't worth fighting for a handful of long f-strings.
# SIM103: rejected deliberately in validation-style functions (price/keyword
# filters) where parallel `if cond: return False` guard clauses read more
# clearly than collapsing the last one into `return not (...)`.
ignore = ["E501", "SIM103"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["tests/", "frontend/"]
